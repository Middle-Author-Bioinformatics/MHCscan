name: Candidate EET wrapper
on:
  push:
    paths: ['mhcscan_eet/**', 'tests/**', 'pyproject.toml', '.github/workflows/eet-tests.yml']
  pull_request:
    paths: ['mhcscan_eet/**', 'tests/**', 'pyproject.toml', '.github/workflows/eet-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[analysis,test]'
      - run: python -m pytest -q
      - run: mhc-eet --help
